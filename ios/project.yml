name: ScrollStats
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  ScrollStatsCore:
    path: .
targets:
  ScrollStats:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: ScrollStatsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scrollstats.iphone
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: ScrollStats
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
